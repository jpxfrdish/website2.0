<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foundiit - Search</title>
    <link rel="stylesheet" href="searchstyle.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="foundiit1.png" alt="logo">
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="Lost.html">Report Found Item</a>
        <a href="found.html">Report Lost Item</a>
    </div>
</div>

<div class="container">
    <h2> Report Found Item</h2>
    <p class="subtitle">
        Found an item? Log it here so its rightful owner can claim it.
    </p>

    <label>Item Name</label>
    <input type="text" placeholder="e.g. Black Wallet">

    <label>Description</label>
    <input type="text" placeholder="Provide a brief description of the item">

    <label>Location Found</label>
    <input type="text" placeholder="e.g. CCS Lobby">

    <label>Date Found</label>
    <input type="date" placeholder="05/18/2026">
    
    <label>Photo Url</label>
    <input type="text" placeholder="Provide a photo of the item">
</div>
<div class="buttons">
    <button class="cancel">Cancel</button>
    <button class="submit">Submit</button>
</div>
</body>
</html>
